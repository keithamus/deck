<div part="bar">
  <div class="scrub" role="navigation" aria-label="Slides"></div>
  <i class="sep"></i>
  <button
    command="--present"
    hidden
    data-tip="Presenter view (S)"
    aria-label="Presenter View"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2 3h20" />
      <path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3" />
      <path d="m7 21 5-5 5 5" />
    </svg>
  </button>
  <button command="--record" hidden data-tip="Record (R)" aria-label="Record">
    <svg viewBox="0 0 24 24" aria-hidden="true" name="record">
      <circle cx="12" cy="12" r="6" fill="#e5484d" />
    </svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" name="stop">
      <rect x="6" y="6" width="12" height="12" rx="2" fill="#e5484d" />
    </svg>
  </button>
  <button
    command="--record-pause"
    data-attr="Pause recording (.)"
    aria-label="Pause recording"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" name="pause">
      <rect x="14" y="4" width="4" height="16" rx="1" />
      <rect x="6" y="4" width="4" height="16" rx="1" />
    </svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" name="resume">
      <polygon points="6 3 20 12 6 21 6 3" />
    </svg>
  </button>
  <button command="--fullscreen" data-tip="Full screen (F)">
    <svg viewBox="0 0 24 24" aria-hidden="true" name="maximise">
      <path d="M8 3H5a2 2 0 0 0-2 2v3" />
      <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
      <path d="M3 16v3a2 2 0 0 0 2 2h3" />
      <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
    </svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" name="minimise">
      <path d="M8 3v3a2 2 0 0 1-2 2H3" />
      <path d="M21 8h-3a2 2 0 0 1-2-2V3" />
      <path d="M3 16h3a2 2 0 0 1 2 2v3" />
      <path d="M16 21v-3a2 2 0 0 1 2-2h3" />
    </svg>
  </button>
  <button command="--help" data-tip="Shortcuts (?)" aria-label="Shortcuts">
    <svg viewBox="0 0 24 24" aria-hidden="true" name="minimise">
      <path d="M10 8h.01" />
      <path d="M12 12h.01" />
      <path d="M14 8h.01" />
      <path d="M16 12h.01" />
      <path d="M18 8h.01" />
      <path d="M6 8h.01" />
      <path d="M7 16h10" />
      <path d="M8 12h.01" />
      <rect width="20" height="16" x="2" y="4" rx="2" />
    </svg>
  </button>
  <slot></slot>
</div>
<div part="edge" class="l">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="m15 18-6-6 6-6" />
  </svg>
</div>
<div part="edge" class="r">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="m9 18 6-6-6-6" />
  </svg>
</div>
